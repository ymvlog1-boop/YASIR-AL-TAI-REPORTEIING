name: OAuth cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oauth-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Simplify Google OAuth scope
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'scope: "openid email profile https://www.googleapis.com/auth/gmail.send",'
          new = 'scope: "https://www.googleapis.com/auth/gmail.send",\n    include_granted_scopes: false,'
          if old not in text:
              raise SystemExit('Expected OAuth scope line not found')
          text = text.replace(old, new, 1)
          text = text.replace('function connectGoogle(){\n  const clientId = GOOGLE_CLIENT_ID;', 'function connectGoogle(){\n  accessToken = null;\n  const clientId = GOOGLE_CLIENT_ID;', 1)
          p.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/oauth-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Gmail OAuth flow" || exit 0
          git push
