name: Update site brand name

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Arabic and English brand name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "منظومة المصور ياسر الطائي لحماية المحتوى وإدارة البلاغات": "منظومة ياسر الطائي لإدارة البلاغات | YT Reports",
              "عن منظومة المصور ياسر الطائي لحماية المحتوى وإدارة البلاغات": "عن منظومة ياسر الطائي لإدارة البلاغات | YT Reports",
              "سياسة الخصوصية — منظومة المصور ياسر الطائي": "سياسة الخصوصية — منظومة ياسر الطائي لإدارة البلاغات | YT Reports",
              "شروط الاستخدام — منظومة المصور ياسر الطائي": "شروط الاستخدام — منظومة ياسر الطائي لإدارة البلاغات | YT Reports",
          }

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No branding changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "Update site branding to YT Reports"
          git push
